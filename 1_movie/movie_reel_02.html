<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リール動画 02</title>
  <link rel="stylesheet" href="/css/style.css">
  <!-- FontAwesome (アイコン用) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- ヘッダー (ここに header.html が読み込まれる) -->
  <header class="site-header" id="common-header"></header>

  <!-- メインコンテンツ領域 -->
  <div class="container">
    
    <!-- 左側：メインエリア -->
    <main class="main-content">

      <!-- 記事本体カード -->
      <article class="card-section post-detail">
        
        <!-- 記事ヘッダー -->
        <header class="post-header">
          <h1 class="post-title">リール動画 02</h1>
          <span class="accent-line"></span>
          <div class="post-meta">
            
            <!-- カテゴリー付け　movie graphic others どれか -->
            <span class="category-badge">movie</span>
            <time class="date">2026/09</time>
          </div>
        </header>

        <!-- YouTube動画埋め込み (16:9レスポンシブ表示) -->
        <div class="post-eyecatch post-video">
          <iframe src="https://www.youtube.com/embed/z0wa6ziLoZY" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>

        <!-- 記事本文 -->
        <div class="post-body">
          <h3>映像</h3>
          <p>
            会社紹介やインタビュー動画、研修動画等をまとめたリール動画
          </p>
          <h3>使用ソフト</h3>
          <p>
            AfterEffects Premiere illustrator Photoshop
          </p>
          <h3>制作期間</h3>
          <p>
            ー
          </p>
          <h3>内容</h3>          
          <p>
            企画・構成から、撮影・編集まで一貫して対応
          </p>
        </div>

      </article>

      <!-- パンくずリスト -->
      <nav class="breadcrumb">
        <a href="/index.html">ホーム</a> <i class="fa-solid fa-chevron-right"></i>
        <a href="/index.html#movie">movie</a> <i class="fa-solid fa-chevron-right"></i>
        <span>リール動画 02</span>
      </nav>

      <!-- 関連記事 -->
      <section class="card-section">
        <div class="section-title">
          <h2>more movies...</h2>
          <span class="accent-line"></span>
        </div>

        <div class="article-grid">
          <!-- JavaScriptで自動挿入するため、div（クラス名）のみ記述！ -->
        </div>
      </section>

    </main>

<!-- サイドバー (ここに sidebar.html が読み込まれる) -->
    <aside class="sidebar" id="common-sidebar"></aside>
  </div>

<!-- フッター (ここに footer.html が読み込まれる) -->
  <footer class="site-footer" id="common-footer"></footer>

  <!-- 外部JavaScriptファイルの読み込み -->
  <script src="/js/script.js"></script>

</body>
</html>
